# Lint, test and build every pull request and every push to main.
# A push to main (a merged PR) then publishes the build to GitHub Pages.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          VITE_ONLINE_SERVER: ${{ vars.ONLINE_SERVER_URL }} # Online play (see server/README.md); empty = local only

  # Same as `npm run deploy`: push dist/ to the gh-pages branch, which Pages already serves
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_ONLINE_SERVER: ${{ vars.ONLINE_SERVER_URL }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # gh-pages takes the commit author from the git config above (its -u option can't parse "[bot]")
          npx gh-pages -d dist -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Same as `npm run deploy` in server/: publish the online game server to Cloudflare,
  # but only when this push changed server/ or src/game/ (the rules the server runs).
  # Needs the repository secret CLOUDFLARE_API_TOKEN (see server/README.md); without it this is skipped.
  deploy-server:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: game-server
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # To see what this push changed
      - id: changed
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret: the server is deployed by hand (server/README.md)"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" HEAD -- server src/game 2>/dev/null; then
            echo "server/ and src/game/ unchanged: nothing to deploy"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT" # Changed, or the previous commit is unknown
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BEFORE: ${{ github.event.before }}
      - uses: actions/setup-node@v7
        if: steps.changed.outputs.deploy == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: steps.changed.outputs.deploy == 'true'
        working-directory: server
        run: npm ci && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} # Optional: only needed if the token sees several accounts
